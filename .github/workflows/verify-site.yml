name: Verify SAMAS brochure site

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/verify-site.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify DNS and HTTPS
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DNS CNAME ==="
          dig +short CNAME brochure.samas.qa
          echo "=== DNS A ==="
          dig +short A brochure.samas.qa
          echo "=== HTTPS homepage ==="
          curl -fsSIL --retry 5 --retry-delay 5 --connect-timeout 15 --max-time 60 https://brochure.samas.qa/
          echo "=== Homepage content ==="
          curl -fsSL --retry 5 --retry-delay 5 --connect-timeout 15 --max-time 60 https://brochure.samas.qa/ | grep -F "Al Tanour Al Reefi"
          echo "=== Brochure PDF ==="
          curl -fsSIL --retry 5 --retry-delay 5 --connect-timeout 15 --max-time 60 https://brochure.samas.qa/assets/samas-brochure.pdf
          echo "=== PDF signature ==="
          curl -fsSL --retry 5 --retry-delay 5 --connect-timeout 15 --max-time 60 https://brochure.samas.qa/assets/samas-brochure.pdf | head -c 5 | grep -F "%PDF-"
          echo "SAMAS_SITE_VERIFIED"
