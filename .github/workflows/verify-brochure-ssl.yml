name: Verify brochure SSL now

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/verify-brochure-ssl.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check certificate and page
        shell: bash
        run: |
          echo "=== DNS ==="
          dig +short CNAME brochure.samas.qa
          echo "=== TLS ==="
          echo | openssl s_client -servername brochure.samas.qa -connect brochure.samas.qa:443 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName || true
          echo "=== HTTPS ==="
          curl -I --max-time 30 https://brochure.samas.qa/ || true
