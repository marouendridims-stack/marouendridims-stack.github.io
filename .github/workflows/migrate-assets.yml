name: Migrate SAMAS brochure assets

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/migrate-assets.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download existing SAMAS assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          fetch() {
            local out="$1"; shift
            for url in "$@"; do
              echo "Trying $url"
              if curl -fL --retry 3 --connect-timeout 20 --max-time 180 "$url" -o "$out"; then
                test -s "$out" && return 0
              fi
            done
            return 1
          }
          fetch assets/samas-brochure.pdf             "https://samas-digital-brochure-tpgrcc.v2.appdeploy.ai/resources/samas-brochure.pdf"             "https://brochure.samas.qa/resources/samas-brochure.pdf"
          fetch assets/samas-logo.png             "https://samas-digital-brochure-tpgrcc.v2.appdeploy.ai/resources/samas-logo.png"             "https://brochure.samas.qa/resources/samas-logo.png"
          file assets/samas-brochure.pdf assets/samas-logo.png
          test $(stat -c%s assets/samas-brochure.pdf) -gt 100000
          test $(stat -c%s assets/samas-logo.png) -gt 1000
      - name: Commit migrated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/samas-brochure.pdf assets/samas-logo.png
          git diff --cached --quiet && exit 0
          git commit -m "Migrate SAMAS brochure assets to GitHub"
          git push
