name: Check SAMAS DNS

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/check-dns.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS and HTTP checks
        shell: bash
        run: |
          echo "=== samas.qa A ==="
          dig +short A samas.qa
          echo "=== samas.qa AAAA ==="
          dig +short AAAA samas.qa
          echo "=== samas.qa CNAME ==="
          dig +short CNAME samas.qa
          echo "=== brochure.samas.qa CNAME ==="
          dig +short CNAME brochure.samas.qa
          echo "=== brochure.samas.qa A ==="
          dig +short A brochure.samas.qa
          echo "=== HTTP samas.qa/brochure ==="
          curl -IL --max-time 30 http://samas.qa/brochure || true
          echo "=== HTTPS samas.qa/brochure ==="
          curl -kIL --max-time 30 https://samas.qa/brochure || true
          echo "=== HTTPS brochure.samas.qa ==="
          curl -kIL --max-time 30 https://brochure.samas.qa/ || true
